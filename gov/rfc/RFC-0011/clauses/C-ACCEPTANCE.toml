#:schema ../../../schema/clause.schema.json

[govctl]
id = "C-ACCEPTANCE"
title = "Verification and compatibility evidence"
kind = "normative"
status = "active"
since = "0.1.0"

[content]
text = "Acceptance MUST cover native creation for all three kinds with explicit Agent identity, version-bound contributions, comments and replies, review verdicts and resolution, unsigned versus trusted provenance, content changes, independent review rules, malformed input, traversal/symlink rejection and concurrent idempotent publication. A legacy Lattice signed review MUST verify with its explicit public key and retain exact bytes, target and ID through native reads and replay. CLI contract, schema and generated documentation MUST remain coherent."
