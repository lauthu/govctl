#:schema ../../../schema/clause.schema.json

[govctl]
id = "C-CANDIDATE-SNAPSHOT"
title = "Immutable candidate review input snapshots"
kind = "normative"
status = "active"
since = "0.3.0"

[content]
text = """
The CLI MUST expose `govctl coord candidate-snapshot --context-file PATH --request-id ID` as a read-only operation independent of the caller workspace and signing key. The command MUST use the external context and canonical-main history validation of this RFC. It MUST NOT publish control records, grant ownership, invoke a runtime, apply source changes, mutate the caller workspace, or execute repository configuration, templates or hooks. Its capability MUST be named `candidate-input-snapshot-v1` and MUST be additive to the existing version-1 capabilities and operation wire contract.

The named request MUST be a read-only `review` request with empty `writeTargets` and a non-null fixed `target.commit`. An unknown request MUST fail with `COORD_NOT_FOUND`; a request outside this supported form MUST fail with `COORD_UNSUPPORTED`. The canonical baseline MUST still match the request's fixed document input, and the fixed candidate commit MUST remain reachable from the canonical remote's currently advertised branches or tags. A changed or unavailable baseline, unavailable candidate commit, or missing or malformed candidate governance source MUST fail with `COORD_SOURCE_CHANGED`. A terminal request MAY be read when these input conditions remain satisfied. Unsafe source paths MUST fail closed without returning a partial package.

A successful response MUST contain `protocolVersion: 1`, `repoId`, canonical `head`, `authority` with `id` and `revision`, the complete current projected `request`, `baseline`, and `candidate`. `baseline` MUST contain `target`, `body` and `content` for the canonical artifact at `head`. `candidate` MUST contain `commit`, `target`, `body`, `content` and `authorEvidence` for the same repository, artifact kind and artifact ID at the request's fixed code commit. `candidate.commit` MUST equal `request.target.commit`. Both nested `target` objects MUST be native document targets with `commit: null`; each target's version and content digest MUST describe its own source revision under [[RFC-0011:C-TARGET]]. The candidate document version or digest MAY differ from the baseline. Baseline source bytes MUST come from `head`; all candidate source bytes and candidate attached records MUST come from `candidate.commit`. The response MUST NOT identify baseline text as candidate text or use the coordination head as the candidate commit.

Both document representations MUST follow the complete archival Markdown and native structured-content requirements of [[RFC-0012:C-SNAPSHOT]], including RFC clause sources in section-reference order and exclusion of unreferenced source text. Candidate `authorEvidence` MUST use that Clause's creator-declaration, current-policy signature trust and malformed-record diagnostic rules, selecting valid authorship records whose complete target equals `candidate.target`, including its null code commit. Candidate authorship MUST remain document-revision evidence distinct from the candidate Git commit. The whole encoded response MUST be limited to 16 MiB and MUST NOT omit or truncate content to fit; an oversized package MUST fail with `COORD_UNSUPPORTED` without partial output.

This command MUST NOT assert that a remote pull request still names the fixed commit, that the candidate descends from a particular source base, that its changes satisfy a client's permitted scope, or that its author evidence is complete. A client reviewing the candidate MUST bind its conclusion to both the candidate document target and `candidate.commit`, and MUST independently check current ownership, authorization and any required remote pull-request identity before starting execution or publishing a result. The command MUST NOT create an effective standalone approval, advance a lifecycle, or change the interpretation of an existing review or result. Existing `coord snapshot` MUST retain its canonical-main body and evidence semantics even when its request has a non-null code target."""
