#:schema ../../../schema/clause.schema.json

[govctl]
id = "C-GENERATION"
title = "Claim generations and explicit transfer"
kind = "normative"
status = "active"
since = "0.1.0"

[content]
text = "Accepted ownership transitions MUST use monotonically increasing generations for each request and each artifact write scope so that a previous holder cannot regain authority by replaying an old operation. A handoff offer MUST identify the current request and write-scope generations, intended recipient and checkpoint. Publishing an offer MUST NOT transfer execution authority; the offering holder retains it until an authorized transfer, release, cancellation or completion. Only the named recipient MAY accept a still-current offer. Acceptance MUST atomically transfer the request and its write scopes, advance their generations and invalidate the prior holder's authority. A takeover MUST name the affected scopes, their prior generations and the new holder, and MUST atomically invalidate the prior holder's authority over those scopes. The resulting claims MUST satisfy [[RFC-0012:C-EXCLUSION]]. Takeover MUST include an explicit authorization decision and reason. Release, cancellation and completion MUST invalidate the affected claims and outstanding offers for future effective results; an idempotent replay of an already accepted result remains valid under [[RFC-0012:C-REQUEST]]. This version MUST NOT infer takeover or release solely from wall-clock age, a missing heartbeat or an unavailable process. Results from obsolete generations MUST NOT mutate artifacts or complete the current request."
